<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вітаємо у проекті!</title>
    <style>
        body {
            background: linear-gradient(135deg, #1f4068, #162447);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .welcome-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 500px;
        }
        h1 {
            color: #e43f5a;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #e4e4e4;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background-color: #e43f5a;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 5px 15px rgba(228, 63, 90, 0.4);
        }
        .btn:hover {
            background-color: #ff4a6e;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="welcome-container">
        <h1>WELCOME TO PROGECT👋</h1>
        <p>This is a simple html and css table created for all contributors.</p>
        <a href="index.html" class="btn">GO TO THE TABLE OF DEVELOPERS</a>
    </div>

</body>
</html>
